<title>합력하여 선을 이루는 기도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: phone-width column on a cool paper ground; white grouped cards carry content; one deep-navy scripture card is the only dark surface; white frosted tab bar.
   Single light theme on purpose: the owner asked for high readability on phones. */
:root {
  color-scheme: light;
  --bg: #F3F5F9; --surface: #FFFFFF; --ink: #121933; --ink-2: #3B4462; --muted: #6A7290; --line: #E5E9F1; --line-2: #EEF1F6;
  --navy: #17204A; --navy-2: #263777; --on-navy: #F4F6FF; --navy-sub: #B7C3EC;
  --accent: #3348B3; --on-accent: #FFFFFF; --accent-soft: #EDF0FB;
  --gold: #A0650A; --gold-soft: #FCF2E0; --green: #1E774B; --green-soft: #E4F3EB; --amber: #B0540C; --amber-soft: #FFEFE0;
  --paper: #FFFBF1; --paper-line: #EADBBB; --warn: #B3412E;
  --shadow: 0 1px 2px rgba(18, 25, 51, .04), 0 6px 20px rgba(18, 25, 51, .05);
  --font-display: "Gowun Batang", "AppleMyungjo", "Batang", serif;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --r: 16px;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14.5px; line-height: 1.6; word-break: keep-all; overflow-wrap: anywhere; margin: 0; padding-inline: 16px; padding-block: 0 150px; -webkit-font-smoothing: antialiased; }
.app { max-width: 560px; margin: 0 auto; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.4; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.brand { min-width: 0; display: flex; align-items: center; gap: 9px; background: none; border: 0; padding: 0; text-align: left; }
.brand .mark { flex: none; width: 32px; height: 32px; border-radius: 10px; background: radial-gradient(110% 100% at 100% 0%, var(--navy-2), var(--navy) 70%); display: grid; place-items: center; box-shadow: 0 3px 10px rgba(23, 32, 74, .25); }
.brand .mark svg { width: 22px; height: 22px; }
.brand-name { min-width: 0; font-family: var(--font-display); font-weight: 700; font-size: 19px; color: var(--navy); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.02em; }
.fab { position: fixed; z-index: 9; right: max(16px, calc((100vw - 560px) / 2 + 16px)); bottom: calc(72px + env(safe-area-inset-bottom, 0px)); display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 999px; padding: 13px 20px 13px 16px; font-size: 15px; font-weight: 700; color: #FFFFFF; background: linear-gradient(135deg, var(--accent), var(--navy)); box-shadow: 0 8px 22px rgba(35, 50, 140, .38), 0 2px 6px rgba(18, 25, 51, .15); }
.fab svg { width: 18px; height: 18px; }
.drawer-brand { font-family: var(--font-display); font-weight: 700; font-size: 17px; color: var(--navy); }
.drawer-brand small { display: block; font-family: var(--font-body); font-weight: 400; font-size: 12px; color: var(--muted); }
.top-actions { display: flex; align-items: center; gap: 0; flex: none; }
.icon-btn { background: none; border: 0; width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; color: var(--navy); }
.icon-btn svg { width: 23px; height: 23px; }

/* tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: rgba(255, 255, 255, .94); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar nav { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tabbar button { background: none; border: 0; padding: 8px 2px 8px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--muted); }
.tabbar svg { width: 24px; height: 24px; fill: none; stroke: var(--accent); }
.tabbar button[aria-current="page"] { color: var(--accent); font-weight: 700; }
.tabbar button[aria-current="page"] svg { fill: var(--accent); stroke: #FFFFFF; }
.tabbar button[aria-current="page"] svg .edge { stroke: var(--accent); }

.stack { display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--surface); border-radius: var(--r); padding: 16px; min-width: 0; box-shadow: var(--shadow); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.label { font-size: 12px; letter-spacing: 0.04em; color: var(--muted); font-weight: 500; }

/* scripture */
.verse { position: relative; overflow: hidden; margin-inline: -16px; border-radius: 0; padding: 28px 24px 24px; color: var(--on-navy);
  background: radial-gradient(120% 90% at 100% 0%, var(--navy-2) 0%, var(--navy) 62%); }
.verse svg.globe { position: absolute; right: -40px; top: -30px; width: 240px; height: 240px; pointer-events: none; }
.verse .eyebrow { position: relative; font-size: 11px; letter-spacing: .14em; color: var(--navy-sub); font-weight: 500; margin-bottom: 8px; }
.verse p { position: relative; font-family: var(--font-display); font-size: 16px; margin: 0 0 10px; line-height: 1.75; max-width: 30em; }
.verse cite { position: relative; font-style: normal; font-size: 12px; color: var(--navy-sub); font-weight: 500; }

/* sections */
.sec { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-inline: 2px; }
.sec-head h2 { font-family: var(--font-display); font-size: 16.5px; font-weight: 700; color: var(--navy); letter-spacing: -0.01em; }
.sec-head .date { font-size: 12px; color: var(--muted); }
.more { background: none; border: 0; padding: 2px 0; color: var(--muted); font-size: 12.5px; display: inline-flex; align-items: center; gap: 2px; }
.more::after { content: ""; width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-top: 1.5px solid currentColor; transform: rotate(45deg); margin-left: 3px; }

/* today */
.today { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--surface); box-shadow: var(--shadow); border-radius: var(--r); padding: 12px 10px 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 6px; min-width: 0; }
.tile span { display: block; font-size: 12px; color: var(--muted); }
.tile b { display: block; font-family: var(--font-display); font-size: 21px; font-weight: 700; color: var(--navy); font-variant-numeric: tabular-nums; line-height: 1.3; white-space: nowrap; }
.tile b small { font-family: var(--font-body); font-size: 12px; font-weight: 500; color: var(--ink-2); margin-left: 1px; }
.circle { flex: none; width: 50px; height: 50px; border-radius: 50%; border: 0; background: var(--accent-soft); color: var(--accent); font-size: 11px; font-weight: 700; line-height: 1.25; padding: 0 4px; }
.circle.done { background: var(--green-soft); color: var(--green); }

/* grouped list (home) */
.group { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.row-item { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 13px 16px; min-width: 0; }
.row-item + .row-item { border-top: 1px solid var(--line-2); }
.row-item:active { background: var(--bg); }
.row-item h3 { font-size: 14.5px; font-weight: 700; color: var(--ink); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.row-item p { margin: 2px 0 0; font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-item .meta { margin-top: 6px; }
.row-item.line { display: flex; align-items: center; gap: 10px; }
.row-item.line h3 { flex: 1; min-width: 0; font-weight: 500; }
.row-item .kind { flex: none; font-size: 11px; font-weight: 700; color: var(--accent); }

.meta { display: flex; gap: 4px 10px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
.meta .cnt { display: inline-flex; align-items: center; gap: 3px; color: var(--gold); font-weight: 700; }
.meta .cnt svg { width: 13px; height: 13px; }
.pill { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px 8px; }
.pill.amber { color: var(--amber); background: var(--amber-soft); }
.pill.green { color: var(--green); background: var(--green-soft); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--muted); font-size: 13px; }
.linkbtn.blue { color: var(--accent); font-weight: 500; }

/* board cards */
.post { display: block; width: 100%; text-align: left; background: var(--surface); border: 0; border-radius: var(--r); padding: 15px 16px; box-shadow: var(--shadow); }
.post h3 { font-size: 15.5px; margin: 6px 0 3px; color: var(--ink); }
.post p { margin: 0; color: var(--ink-2); font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.post .meta { margin-top: 9px; }

.btn { border: 0; border-radius: 999px; padding: 10px 16px; font-weight: 700; font-size: 14px; background: var(--accent); color: var(--on-accent); }
.btn.navy { background: var(--navy); color: var(--on-navy); }
.btn.ghost { background: var(--accent-soft); color: var(--accent); }
.btn.line { background: var(--surface); border: 1px solid var(--line); color: var(--ink); font-weight: 500; }
.btn.gold { background: var(--gold-soft); color: var(--gold); }
.btn.done { background: var(--green-soft); color: var(--green); }
.btn.sm { padding: 6px 12px; font-size: 12.5px; }
.btn.block { width: 100%; padding: 13px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row.between { justify-content: space-between; }

.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--navy); color: var(--on-navy); border-color: var(--navy); }
.tag { display: inline-block; font-size: 11px; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 1px 7px; }
.tag.gold { color: var(--gold); background: var(--gold-soft); }
.tag.good { color: var(--green); background: var(--green-soft); }
.tag.example { color: var(--muted); background: transparent; border: 1px dashed var(--line); font-weight: 500; }

.seg { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); background: #E7EBF3; border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 7px 4px; font-size: 13.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: 0 1px 3px rgba(18, 25, 51, .08); }

.search { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 14px; }
.page-title { font-size: 19px; font-family: var(--font-display); color: var(--navy); padding-inline: 2px; }
.note { background: var(--accent-soft); color: var(--ink-2); border-radius: 12px; padding: 10px 14px; font-size: 13px; }

.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: 13px; font-weight: 500; color: var(--ink-2); }
.input, textarea.input, select.input { width: 100%; border: 1px solid var(--line); background: #F8F9FC; border-radius: 10px; padding: 10px 12px; }
textarea.input { min-height: 140px; resize: vertical; line-height: 1.7; }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; }

.progress { height: 6px; background: var(--accent-soft); border-radius: 999px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.dots { display: flex; flex-wrap: wrap; gap: 4px; }
.dots i { width: 10px; height: 10px; border-radius: 3px; background: #DCE2EE; }
.dots i.on { background: var(--gold); }
.dots i.today { outline: 2px solid var(--navy); outline-offset: 1px; }
.dots i.future { background: transparent; border: 1px solid var(--line); }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface); box-shadow: var(--shadow); border-radius: var(--r); padding: 12px; }
.stat b { display: block; font-family: var(--font-display); font-size: 19px; color: var(--navy); white-space: nowrap; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.chart { display: grid; align-items: end; gap: 4px; height: 150px; padding-top: 18px; border-bottom: 1px solid var(--line); }
.chart .bar { position: relative; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 2px; }
.chart .bar.zero { background: var(--line); }
.chart .bar b { position: absolute; top: -17px; left: 50%; transform: translateX(-50%); font-size: 10.5px; font-weight: 500; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chart-x { display: grid; gap: 4px; font-size: 10.5px; color: var(--muted); text-align: center; margin-top: 4px; font-variant-numeric: tabular-nums; }

.paper { background: var(--paper); border: 1px solid var(--paper-line); border-radius: 6px; padding: 22px 20px; font-family: var(--font-display); background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 31px, var(--paper-line) 31px, var(--paper-line) 32px); background-position: 0 14px; line-height: 32px; }
.paper .date { font-size: 13px; color: var(--muted); }
.paper .vs { color: var(--gold); font-size: 14.5px; }
.paper .body { white-space: pre-wrap; font-size: 16px; }
textarea.paper { width: 100%; min-height: 260px; resize: vertical; font-size: 16px; padding-top: 8px; }

.comment { border-top: 1px solid var(--line); padding-top: 10px; }
.comment b { font-size: 13px; }
.comment p { margin: 2px 0 0; font-size: 14px; white-space: pre-wrap; }
.body-text { white-space: pre-wrap; font-size: 15px; line-height: 1.85; margin: 0; color: var(--ink); }

.sheet-back { position: fixed; inset: 0; z-index: 20; background: rgba(12, 18, 40, 0.42); display: flex; align-items: flex-end; justify-content: center; }
.sheet { position: relative; background: var(--surface); width: 100%; max-width: 560px; max-height: 86%; overflow-y: auto; overscroll-behavior: contain; border-radius: 22px 22px 0 0; padding: 0 18px calc(24px + env(safe-area-inset-bottom, 0px)); transition: max-height .25s ease, border-radius .25s ease; }
.sheet.full { height: 100%; max-height: 100%; border-radius: 0; }
.sheet.full .sheet-head { padding-top: calc(16px + env(safe-area-inset-top, 0px)); }
.sheet.full .grab { top: calc(6px + env(safe-area-inset-top, 0px)); }
.sheet.full textarea.input, .sheet.full textarea.paper { min-height: calc(100vh - 250px); min-height: calc(100dvh - 250px); }
.grab { position: absolute; top: 6px; left: 50%; width: 40px; height: 5px; margin-left: -20px; border-radius: 99px; background: #D3D9E6; }
.sheet-tools { display: flex; align-items: center; gap: 6px; flex: none; }
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.checks { display: flex; flex-wrap: wrap; gap: 8px 18px; }
.check.urgent { color: #B42A1A; font-weight: 700; }
.pill.red { color: #B42A1A; background: #FDEBE8; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.scrap { flex: none; display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 0 14px; font-size: 13px; font-weight: 700; }
.scrap svg { width: 17px; height: 17px; }
.scrap[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.scrap[aria-pressed="true"] svg { fill: currentColor; }
.time-card { background: linear-gradient(160deg, #FFFFFF 0%, var(--accent-soft) 100%); border-radius: 20px; padding: 18px 18px 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; }
.time-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.time-top .label { font-size: 13px; color: var(--ink-2); font-weight: 700; letter-spacing: 0; }
.date-chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 10px; font-size: 12.5px; color: var(--ink-2); max-width: 150px; }
.time-big { display: flex; align-items: baseline; gap: 4px; color: var(--navy); font-family: var(--font-display); line-height: 1; }
.time-big b { font-size: 46px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.time-big span { font-size: 18px; font-weight: 700; margin-right: 6px; }
.time-big.bump { animation: bump .35s ease-out; }
@keyframes bump { 40% { transform: scale(1.06); } }
.time-sub { font-size: 13px; color: var(--ink-2); margin-top: -6px; }
.quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.quick button { border: 0; border-radius: 12px; padding: 11px 0; background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: 14.5px; box-shadow: 0 3px 10px rgba(51, 72, 179, .22); }
.quick button:active { transform: scale(.96); }
.manual { display: flex; gap: 8px; }
.manual .input { flex: 1; min-width: 0; background: var(--surface); }
.log { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.log li { display: flex; align-items: center; gap: 10px; padding: 9px 2px; border-bottom: 1px solid var(--line-2); font-size: 13.5px; }
.log li .at { color: var(--muted); font-variant-numeric: tabular-nums; width: 64px; flex: none; }
.log li b { flex: 1; color: var(--accent); }
.log li button { background: none; border: 0; color: var(--muted); font-size: 12px; padding: 4px; }
.relay-bar { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.relay-bar .progress { flex: 1; }
.slot-group { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
.slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.slot { display: flex; flex-direction: column; align-items: center; gap: 1px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 2px; min-width: 0; }
.slot b { font-size: 13px; color: var(--ink); font-variant-numeric: tabular-nums; }
.slot span { font-size: 11px; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot.taken { background: #EEF1F6; border-color: transparent; }
.slot.taken b { color: var(--ink-2); }
.slot.mine { background: var(--accent); border-color: var(--accent); }
.slot.mine b, .slot.mine span { color: #FFFFFF; }
.slot.past { opacity: .4; }
.legend { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); }
.lg { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-left: 6px; }
.lg.mine { background: var(--accent); } .lg.taken { background: #DCE2EE; }
.ic-top { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
.att { flex: none; display: flex; flex-direction: column; align-items: center; gap: 5px; background: none; border: 0; padding: 0; width: 70px; font-size: 11.5px; font-weight: 700; color: var(--muted); }
.att i { width: 50px; height: 50px; border-radius: 50%; border: 2px dashed #C3CBDE; display: grid; place-items: center; color: #C3CBDE; transition: background .2s, border-color .2s; }
.att svg { width: 26px; height: 26px; }
.att.on { color: var(--green); }
.att.on i { background: var(--green); border: 2px solid var(--green); color: #FFFFFF; }
.att:disabled { opacity: .5; }
.chk { display: inline-flex; align-items: center; gap: 8px; background: var(--bg); border: 0; border-radius: 999px; padding: 8px 14px 8px 9px; font-size: 13.5px; font-weight: 700; color: var(--muted); align-self: flex-start; }
.chk i { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #C3CBDE; display: grid; place-items: center; color: transparent; }
.chk svg { width: 14px; height: 14px; }
.chk.on { background: var(--gold-soft); color: var(--gold); }
.chk.on i { background: var(--gold); border-color: var(--gold); color: #FFFFFF; }
.ic-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; border-top: 1px solid var(--line-2); padding-top: 10px; }
.wbtn { display: inline-flex; align-items: center; gap: 5px; }
.add-row { display: flex; gap: 8px; align-items: stretch; }
.add-row .btn.block { flex: 1; width: auto; }
.alm-pill { flex: none; display: flex; align-items: center; gap: 8px; background: var(--surface); border-radius: 999px; box-shadow: var(--shadow); padding: 5px 6px 5px 12px; }
.alm-lbl { display: flex; align-items: center; gap: 6px; border: 0; background: none; padding: 0; text-align: left; color: var(--muted); }
.alm-lbl svg { width: 18px; height: 18px; flex: none; }
.alm-lbl span { display: flex; flex-direction: column; line-height: 1.2; }
.alm-lbl b { font-size: 13px; color: var(--ink); }

      '<button class="btn block" data-act="save-edit-time">저장</button>');
  }

  var INVITE = '얼굴을 몰라도 서로를 위해 기도하는 곳, "합력하여 선을 이루는 기도"에 초대해요. 기도 제목을 나누고 함께 중보기도해요.';
  function invite() {
    sheet('초대하기', '<div class="note" style="font-size:14.5px" id="inviteText">' + esc(INVITE) + '</div><button class="btn block" data-copy="invite">초대 문구 복사하기</button><div class="small muted">복사한 문구를 카카오톡이나 문자로 보내 주세요. 정식으로 열면 앱 주소도 함께 들어가요.</div>');
  }

  function val(id) { var e = el(id); return e ? e.value.trim() : ''; }
  function arm(b, label) { if (b.dataset.armed) return true; b.dataset.armed = '1'; b.textContent = label; b.style.color = 'var(--warn)'; return false; }

  // ---------- events ----------
  document.addEventListener('click', function (e) {
    if (e.target.classList && e.target.classList.contains('drawer-back')) return closeDrawer();
    var b = e.target.closest('button, .sheet-back');
    if (!b) return;
    if (b.dataset.close && (e.target === b || b.classList.contains('x'))) return closeSheet();
    if (b.classList.contains('sheet-back')) return;
    var d = b.dataset;
    if (d.tab) { if (d.tab === 'diary' && tab !== 'diary') dtab = 'items'; return go(d.tab); }
    if (d.guideTab) { gtab = d.guideTab; return go('guide'); }
    if (d.go) { if (d.go === 'guide') gtab = 'guides'; return go(d.go); }
    if (d.cat) { cat = d.cat; render(); return; }
    if (d.dtab) { dtab = d.dtab; render(); return; }
    if (d.gtab) { gtab = d.gtab; render(); return; }
    if (d.add) return addTime(tDay || today(), +d.add);
    if (d.wadd) return addTime(today(), +d.wadd);
    if (d.undo) {
      var ud = tDay || today(), ue = S.log[ud].splice(+d.undo, 1)[0];
      S.times[ud] = Math.max(0, (+S.times[ud] || 0) - ue.m); if (!S.times[ud]) delete S.times[ud];
      save(); refreshTime(); toast(ue.m + '분 기록을 지웠어요'); return;
    }
    if (d.range) { range = +d.range; picking = false; render(); return; }
    if (d.scrap) {
      S.scraps = S.scraps || []; var si = S.scraps.indexOf(d.scrap);
      if (si >= 0) S.scraps.splice(si, 1); else { S.scraps.unshift(d.scrap); toast('스크랩했어요. 기도다이어리에서 볼 수 있어요'); }
      save(); openPost(d.scrap); render(); return;
    }
    if (d.dpray) {
      var dp = postById(d.dpray), dx = S.daily.done.indexOf(dp.id);
      if (dx >= 0) { S.daily.done.splice(dx, 1); if (dp.prayed) { dp.prayed = false; dp.prayers--; } }
      else { S.daily.done.push(dp.id); if (!dp.prayed) { dp.prayed = true; dp.prayers++; } toast(S.daily.done.length === S.daily.ids.length ? '오늘의 중보를 모두 마쳤어요!' : '함께 기도한다고 알렸어요'); }
      save(); render(); return;
    }
    if (d.almdel) { S.alarm.times = S.alarm.times.filter(function (x) { return x !== d.almdel; }); save(); alarmSheet(); render(); return; }
    if (d.almday) { var ad = +d.almday, ai = S.alarm.days.indexOf(ad); if (ai >= 0) S.alarm.days.splice(ai, 1); else S.alarm.days.push(ad); save(); alarmSheet(); render(); return; }
    if (d.open) return openPost(d.open);
    if (d.relay) { rDay = ''; return openRelay(d.relay); }
    if (d.rday) { rDay = d.rday; return openRelay(d.rid); }
    if (d.slot) {
      var rg = el('relayGrid'), rr = S.relays.find(function (x) { return x.id === rg.dataset.rid; });
      var mp = rr.slots[rDay] = rr.slots[rDay] || {}, sk = +d.slot;
      if (mp[sk] && mp[sk].me) { delete mp[sk]; toast('예약을 취소했어요'); }
      else if (!mp[sk]) { mp[sk] = { n: S.me.name || '성도', me: true }; toast((rDay === today() ? '오늘' : md(rDay)) + ' ' + slotRange(sk) + ' 기도 시간을 예약했어요'); }
      save(); openRelay(rr.id); render(); return;
    }
    if (d.guide) return openGuide(d.guide);
    if (d.letter) return openLetter(d.letter);
    if (d.days) { el('iDays').value = d.days; el('iDaysChips').querySelectorAll('.chip').forEach(function (c) { c.setAttribute('aria-pressed', c === b); }); return; }
    if (d.pray) {
      var p = postById(d.pray);
      p.prayed = !p.prayed; p.prayers += p.prayed ? 1 : -1; save(); openPost(p.id); render();
      if (p.prayed) toast(p.board === 'pray' ? '함께 기도한다고 알렸어요' : '마음을 전했어요');
      return;
    }
    if (d.comment) {
      var t = val('cText'); if (!t) return toast('내용을 적어 주세요');
      var p2 = postById(d.comment);
      p2.comments.push({ author: S.me.name || '성도', role: S.me.role, text: t, created: Date.now() }); save(); openPost(p2.id); render(); return;
    }
    if (d.report) {
      if (!arm(b, '정말 신고할까요? 한 번 더 누르세요')) return;
      el('repMsg').textContent = '신고가 접수됐어요. 운영자가 확인할게요.'; b.hidden = true; return;
    }
    if (d.submit) {
      var title = val('wTitle'), body = val('wBody'), scope = [];
      if (!title || !body) return toast('제목과 내용을 모두 적어 주세요');
      if (d.submit === 'concern') { document.querySelectorAll('.sc:checked').forEach(function (c) { scope.push(c.value); }); if (!scope.length) return toast('답글을 달 수 있는 분을 1개 이상 골라 주세요'); }
      var np = { id: uid(), board: d.submit, cat: d.submit === 'pray' ? val('wCat') : '', scope: scope, mine: true, urgent: !!(el('wUrgent') && el('wUrgent').checked), title: title, body: body, author: el('wAnon').checked ? '익명의 성도' : (S.me.name || '성도'), created: Date.now(), prayers: 0, prayed: false, comments: [] };
      S.posts.push(np);
      if (d.item) { var li = S.items.find(function (x) { return x.id === d.item; }); if (li) li.postId = np.id; }
      save(); closeSheet();
      if (d.submit === 'tips') { gtab = 'tips'; tab = 'guide'; } else tab = d.submit;
      if (d.submit === 'pray') cat = '전체';
      render(); toast('올렸어요'); return;
    }
    if (d.check) {
      var it = S.items.find(function (x) { return x.id === d.check; }), td = today(), ix = it.checks.indexOf(td);
      if (ix >= 0) it.checks.splice(ix, 1); else { it.checks.push(td); toast('오늘 기도 출석 완료!'); }
      save(); render(); if (d.from === 'sheet') attendSheet(); return;
    }
    if (d.answer) return answerItem(d.answer);
    if (d.saveAnswer) {
      var it2 = S.items.find(function (x) { return x.id === d.saveAnswer; });
      it2.answered = el('aDone').checked; it2.memo = val('aMemo'); var lp = it2.postId && postById(it2.postId); if (lp) lp.answered = it2.answered; save(); closeSheet(); render(); if (it2.answered) toast('응답을 기록했어요. 할렐루야!'); return;
    }
    if (d.toStory) {
      var it3 = S.items.find(function (x) { return x.id === d.toStory; });
      it3.answered = el('aDone').checked; it3.memo = val('aMemo'); save();
      writePost('story', { title: it3.title + ' 기도 응답', body: it3.memo }); return;
    }
    if (d.share) { var it4 = S.items.find(function (x) { return x.id === d.share; }); writePost('pray', { cat: '개인 중보', title: it4.title, body: it4.body || '', itemId: it4.id }); return; }
    if (d.delItem) { if (!arm(b, '한 번 더 누르면 삭제')) return; S.items = S.items.filter(function (x) { return x.id !== d.delItem; }); save(); render(); return; }
    if (d.delLetter) { if (!arm(b, '한 번 더 누르면 삭제')) return; S.letters = S.letters.filter(function (x) { return x.id !== d.delLetter; }); save(); closeSheet(); render(); return; }
    if (d.copy) {
      var txt = INVITE;
      if (d.copy.indexOf('letter:') === 0) { var l = S.letters.find(function (x) { return x.id === d.copy.slice(7); }); txt = l.date + '\n' + (l.verse ? l.verse + '\n\n' : '\n') + l.body; }
      try { navigator.clipboard.writeText(txt).then(function () { toast('복사했어요'); }, function () { toast('복사가 안 되는 환경이에요. 글을 길게 눌러 복사해 주세요'); }); } catch (err) { toast('복사가 안 되는 환경이에요'); }
      return;
    }
    switch (d.act) {
      case 'menu': return openDrawer();
      case 'widget': return widgetSheet();
      case 'alarm': return alarmSheet();
      case 'alm-home': closeSheet(); return go('home');
      case 'alm-toggle':
        S.alarm.on = !S.alarm.on; save(); render(); if (S.alarm.on || el('almTime') || document.querySelector('.alm-on')) alarmSheet();
        if (S.alarm.on) { try { if (window.Notification && Notification.permission === 'default') Notification.requestPermission(); } catch (err) {} toast('기도 알림을 켰어요'); } else toast('기도 알림을 껐어요');
        return;
      case 'alm-add':
        var at = val('almTime'); if (!at) return toast('시간을 골라 주세요');
        if (S.alarm.times.indexOf(at) >= 0) return toast('이미 있는 시간이에요');
        S.alarm.times.push(at); S.alarm.on = true; save(); alarmSheet(); render(); toast(at + ' 알림을 추가했어요'); return;
      case 'w-attend':
        var wa = activeItems(), wt = today(); if (!wa.length) return toast('작정 중인 기도 제목이 없어요');
        var allOn = wa.every(function (i) { return i.checks.indexOf(wt) >= 0; });
        wa.forEach(function (i) { var x = i.checks.indexOf(wt); if (allOn && x >= 0) i.checks.splice(x, 1); if (!allOn && x < 0) i.checks.push(wt); });
        save(); refreshTime(); toast(allOn ? '오늘 출석을 취소했어요' : '오늘 기도 출석 완료!'); return;
      case 'invite': closeDrawer(); return invite();
      case 'attend': return attendSheet();
      case 'write-pray': return writePost('pray', { cat: cat !== '전체' ? cat : '' });
      case 'write-story': return writePost('story');
      case 'write-concern': return writePost('concern');
      case 'write-tips': return writePost('tips');
      case 'add-item': return addItem();
      case 'write-letter': return writeLetter();
      case 'logtime': tDay = ''; return logTime();
      case 'save-item': case 'save-item-share':
        var ti = val('iTitle'), days = Math.max(1, Math.min(365, parseInt(val('iDays'), 10) || 40)), ib = val('iBody');
        if (!ti) return toast('기도 제목을 적어 주세요');
        var ni = { id: uid(), title: ti, body: ib, start: val('iStart') || today(), days: days, checks: [], answered: false, memo: '' };
        S.items.push(ni);
        save(); closeSheet(); tab = 'diary'; dtab = 'items'; render();
        if (d.act === 'save-item-share') { writePost('pray', { cat: '개인 중보', title: ti, body: ib, itemId: ni.id }); toast('다이어리에 추가했어요. 요청 내용을 확인하고 올려 주세요'); return; }
        toast(days + '일 작정 기도를 시작해요'); return;
      case 'add-time':
        var mn = parseInt(val('tMin'), 10);
        if (isNaN(mn) || mn <= 0) return toast('방금 기도한 시간을 분으로 적어 주세요');
        return addTime(tDay || today(), mn);
      case 'edit-time': return editTime();
      case 'save-edit-time':
        var ed = val('eDate') || today(), em = parseInt(val('eMin'), 10);
        if (isNaN(em) || em < 0) return toast('기도한 시간을 분으로 적어 주세요');
        if (em === 0) delete S.times[ed]; else S.times[ed] = em;
        if (S.log) delete S.log[ed];
        save(); closeSheet(); render(); toast(md(ed) + ' 기록을 ' + fmtMin(em) + '으로 고쳤어요'); return;
      case 'pick-range': picking = !picking; render(); return;
      case 'apply-range':
        var rf = val('rFrom'), rt = val('rTo');
        if (!rf || !rt) return toast('시작일과 종료일을 골라 주세요');
        if (rf > rt) { var tmp = rf; rf = rt; rt = tmp; }
        if (diffDays(rf, rt) > 91) { rf = addDays(rt, -91); toast('한 번에 92일까지 볼 수 있어요'); }
        cFrom = rf; cTo = rt; range = 'custom'; picking = false; render(); return;
      case 'toggle-full': var shf = el('sheet'); return setFull(!(shf && shf.classList.contains('full')));
      case 'save-letter':
        var lb = val('lBody'); if (!lb) return toast('편지 내용을 적어 주세요');
        S.letters.push({ id: uid(), date: val('lDate') || today(), verse: val('lVerse'), body: lb });
        save(); closeSheet(); tab = 'diary'; dtab = 'letter'; render(); toast('기도 편지를 보관했어요'); return;
      case 'clear-example':
        S.items = S.items.filter(function (x) { return !x.example; });
        S.letters = S.letters.filter(function (x) { return !x.example; });
        S.times = {}; S.example = false; save(); render(); toast('예시 기록을 지웠어요'); return;
      case 'save-me':
        S.me.name = val('meName') || '성도'; S.me.role = el('meRole').value; save(); render(); toast('저장했어요'); return;
      case 'reset':
        if (!arm(b, '모든 기록이 지워져요. 한 번 더 누르세요')) return;
        S = seed(); save(); go('home'); toast('처음 상태로 되돌렸어요'); return;
    }
  });

  document.addEventListener('change', function (e) {
    if (e.target.id === 'tDate') { tDay = e.target.value && e.target.value !== today() ? e.target.value : ''; refreshTime(); }
    if (e.target.id === 'scAll') document.querySelectorAll('.sc').forEach(function (c) { c.checked = e.target.checked; });
    else if (e.target.classList.contains('sc')) el('scAll').checked = Array.prototype.every.call(document.querySelectorAll('.sc'), function (c) { return c.checked; });
  });

  el('topWrite').addEventListener('click', function () { writePost('pray', { cat: tab === 'pray' && cat !== '전체' ? cat : '' }); });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'q') { q = e.target.value; var pos = e.target.selectionStart; render(); var n = el('q'); n.focus(); try { n.setSelectionRange(pos, pos); } catch (err) {} }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeSheet(); closeDrawer(); }
    if (e.key === 'Enter' && e.target.id === 'cText') { var b = document.querySelector('[data-comment]'); if (b) b.click(); }
    if (e.key === 'Enter' && e.target.id === 'dq' && e.target.value.trim()) { searchQ = e.target.value.trim(); go('search'); }
  });

  render();
  setInterval(alarmTick, 15000); alarmTick();
  if ('serviceWorker' in navigator && location.protocol === 'https:' && document.querySelector('link[rel=manifest]')) {
    try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {}
  }
})();
</script>
