</head><body>

<title>합력하여 선을 이루는 기도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: phone-width column on a cool paper ground; white grouped cards carry content; one deep-navy scripture card is the only dark surface; white frosted tab bar.
   Single light theme on purpose: the owner asked for high readability on phones. */
:root {
  color-scheme: light;
  --bg: #F3F5F9; --surface: #FFFFFF; --ink: #121933; --ink-2: #3B4462; --title: #4A4D55; --muted: #6A7290; --line: #E5E9F1; --line-2: #EEF1F6;
  --navy: #17204A; --navy-2: #263777; --on-navy: #F4F6FF; --navy-sub: #B7C3EC;
  --accent: #263777; --on-accent: #FFFFFF; --accent-soft: #EDF0FB;
  --gold: #A0650A; --gold-soft: #FCF2E0; --green: #A0650A; --green-soft: #FCF2E0; --amber: #A0650A; --amber-soft: #FCF2E0;
  --paper: #FFFBF1; --paper-line: #EADBBB; --warn: #B3412E;
  --shadow: none;
  --font-display: "Gowun Batang", "AppleMyungjo", "Batang", serif;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --r: 16px;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14.5px; line-height: 1.6; word-break: keep-all; overflow-wrap: anywhere; margin: 0; padding-inline: 16px; padding-block: 0 150px; -webkit-font-smoothing: antialiased; }
.app { max-width: 560px; margin: 0 auto; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.4; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 12px; margin-inline: -16px; padding-inline: 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.brand { min-width: 0; display: flex; align-items: center; gap: 9px; background: none; border: 0; padding: 0; text-align: left; }
.brand .mark { flex: none; width: 36px; height: 36px; border-radius: 10px; background: radial-gradient(110% 100% at 100% 0%, var(--navy-2), var(--navy) 70%); display: grid; place-items: center; box-shadow: 0 3px 10px rgba(23, 32, 74, .25); }
.brand .mark svg { width: 22px; height: 22px; }
.brand-txt { min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
.brand-sub { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.01em; margin-top: 1px; }
.brand-name { min-width: 0; font-family: var(--font-display); font-weight: 700; font-size: 17px; color: var(--navy); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.02em; }
.fab { position: fixed; z-index: 9; right: max(16px, calc((100vw - 560px) / 2 + 16px)); bottom: calc(72px + env(safe-area-inset-bottom, 0px)); display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 999px; padding: 13px 20px 13px 16px; font-size: 15px; font-weight: 700; color: #FFFFFF; background: linear-gradient(135deg, var(--accent), var(--navy)); box-shadow: 0 8px 22px rgba(35, 50, 140, .38), 0 2px 6px rgba(18, 25, 51, .15); }
.fab svg { width: 18px; height: 18px; }
.drawer-brand { font-family: var(--font-display); font-weight: 700; font-size: 17px; color: var(--navy); }
.drawer-brand small { display: block; font-family: var(--font-body); font-weight: 400; font-size: 12px; color: var(--muted); }
.top-actions { display: flex; align-items: center; gap: 0; flex: none; }
.icon-btn { background: none; border: 0; width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; color: var(--navy); }
.icon-btn svg { width: 23px; height: 23px; }

/* tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: rgba(255, 255, 255, .94); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar nav { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tabbar button { background: none; border: 0; padding: 8px 2px 8px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--muted); }
.tabbar svg { width: 24px; height: 24px; fill: none; stroke: var(--accent); }
.tabbar button[aria-current="page"] { color: var(--accent); font-weight: 700; }
.tabbar button[aria-current="page"] svg { fill: var(--accent); stroke: #FFFFFF; }
.tabbar button[aria-current="page"] svg .edge { stroke: var(--accent); }

.stack { display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--surface); border-radius: var(--r); padding: 16px; min-width: 0; box-shadow: var(--shadow); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.label { font-size: 12px; letter-spacing: 0.04em; color: var(--muted); font-weight: 500; }

/* scripture */
.verse { position: relative; overflow: hidden; margin-inline: -16px; border-radius: 0; padding: 28px 24px 24px; color: var(--on-navy);
  background: radial-gradient(120% 90% at 100% 0%, var(--navy-2) 0%, var(--navy) 62%); }
.verse svg.globe { position: absolute; right: -40px; top: -30px; width: 240px; height: 240px; pointer-events: none; }
.verse .eyebrow { position: relative; font-size: 11px; letter-spacing: .14em; color: var(--navy-sub); font-weight: 500; margin-bottom: 8px; }
.verse p { position: relative; font-family: var(--font-display); font-size: 16px; margin: 0 0 10px; line-height: 1.75; max-width: 30em; }
.verse cite { position: relative; font-style: normal; font-size: 12px; color: var(--navy-sub); font-weight: 500; }

/* sections */
.sec { display: flex; flex-direction: column; gap: 12px; margin-top: 22px; }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-inline: 2px; }
.sec-head h2 { font-family: var(--font-display); font-size: 16.5px; font-weight: 700; color: var(--navy); letter-spacing: -0.01em; }
.sec-head .date { font-size: 12px; color: var(--muted); }
.more { background: none; border: 0; padding: 2px 0; color: var(--muted); font-size: 12.5px; display: inline-flex; align-items: center; gap: 2px; }
.more::after { content: ""; width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-top: 1.5px solid currentColor; transform: rotate(45deg); margin-left: 3px; }

/* today */
.today { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--surface); box-shadow: var(--shadow); border-radius: var(--r); padding: 12px 10px 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 6px; min-width: 0; }
.tile span { display: block; font-size: 12px; color: var(--muted); }
.tile b { display: block; font-family: var(--font-display); font-size: 21px; font-weight: 700; color: var(--navy); font-variant-numeric: tabular-nums; line-height: 1.3; white-space: nowrap; }
.tile b small { font-family: var(--font-body); font-size: 12px; font-weight: 500; color: var(--ink-2); margin-left: 1px; }
.circle { flex: none; width: 50px; height: 50px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); color: var(--navy); font-size: 11px; font-weight: 700; line-height: 1.25; padding: 0 4px; }
.circle.done { border-color: var(--gold); background: var(--gold-soft); color: var(--gold); }

/* grouped list (home) */
.group { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.row-item { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 19px 16px; min-width: 0; }
.row-item + .row-item { border-top: 1px solid var(--line-2); }
.row-item:active { background: var(--bg); }
.row-item h3 { font-size: 13.5px; font-weight: 700; color: var(--title); line-height: 1.5; }
.row-item p { margin: 2px 0 0; font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-item .meta { margin-top: 5px; }
.row-item.line { display: flex; align-items: flex-start; gap: 10px; }
.row-item.line .kind { margin-top: 2px; }
.row-item.line h3 { flex: 1; min-width: 0; font-weight: 500; }
.row-item .kind { flex: none; font-size: 11px; font-weight: 700; color: var(--gold); }

.meta { display: flex; gap: 4px 10px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
.meta .cnt { display: inline-flex; align-items: center; gap: 3px; color: var(--gold); font-weight: 700; }
.meta .cnt svg { width: 13px; height: 13px; }
.pill { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px 8px; }
.pill.amber, .pill.green { color: var(--gold); background: none; padding: 1px 0; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--muted); font-size: 13px; }
.linkbtn.blue { color: var(--accent); font-weight: 500; }

/* board cards */
.post { display: block; width: 100%; text-align: left; background: var(--surface); border: 0; border-radius: var(--r); padding: 20px 16px; box-shadow: var(--shadow); }
.post h3 { font-size: 14.5px; margin: 6px 0 3px; color: var(--title); }
.post p { margin: 0; color: var(--ink-2); font-size: 12.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.post .meta { margin-top: 9px; }

.btn { border: 0; border-radius: 999px; padding: 10px 16px; font-weight: 700; font-size: 14px; background: var(--accent); color: var(--on-accent); }
.btn.navy { background: var(--navy); color: var(--on-navy); }
.btn.ghost { background: var(--accent-soft); color: var(--accent); }
.btn.line { background: var(--surface); border: 1px solid var(--line); color: var(--ink); font-weight: 500; }
.btn.gold { background: var(--gold-soft); color: var(--gold); }
.btn.done { background: var(--green-soft); color: var(--green); }
.btn.sm { padding: 6px 12px; font-size: 12.5px; }
.btn.danger { color: var(--warn); }
.adm-tabs { margin-top: 2px; flex-wrap: wrap; overflow: visible; }
.adm-btns { gap: 6px; flex-wrap: wrap; }
.adm-card h3 { font-size: 14.5px; color: var(--title); }
.adm-card p { margin: 0; color: var(--ink-2); }
.adm-role + .adm-role { border-top: 1px solid var(--line-2); padding-top: 8px; }
.adm-role b { font-size: 13.5px; }
.adm-stats .stat span { display: block; }
.hbars { display: flex; flex-direction: column; gap: 10px; }
.hb { display: grid; grid-template-columns: 84px 1fr 38px; align-items: center; gap: 10px; font-size: 12.5px; }
.hb span { color: var(--ink-2); } .hb em { font-style: normal; text-align: right; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.hb i { height: 8px; background: var(--line-2); border-radius: 4px; overflow: hidden; } .hb i b { display: block; height: 100%; background: var(--navy-2); border-radius: 0 4px 4px 0; }
.vbars { display: flex; align-items: flex-end; gap: 6px; height: 140px; padding-top: 18px; }
.vb { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; position: relative; }
.vb b { width: 100%; max-width: 22px; background: var(--navy-2); border-radius: 4px 4px 0 0; }
.vb:last-child b { background: var(--gold); }
.vb em { position: absolute; top: -16px; font-style: normal; font-size: 11px; font-weight: 700; color: var(--ink-2); white-space: nowrap; }
.vb span { font-size: 10px; color: var(--muted); margin-top: 4px; white-space: nowrap; }
.split { display: flex; gap: 2px; height: 12px; border-radius: 6px; overflow: hidden; } .split b { background: var(--navy-2); } .split b.g2 { background: var(--gold); }
.sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: var(--navy-2); margin-right: 6px; } .sw.g2 { background: var(--gold); }
.btn.block { width: 100%; padding: 13px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row.between { justify-content: space-between; }

.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--navy); color: var(--on-navy); border-color: var(--navy); }
.tag { display: inline-block; font-size: 11px; font-weight: 700; color: var(--gold); background: none; border-radius: 6px; padding: 1px 0; }
.tag.gold { color: var(--gold); }
.tag + .tag:not(.example)::before { content: ""; display: inline-block; width: 1px; height: 9px; background: #D3D9E6; margin: 0 8px 0 0; vertical-align: -0.5px; }
.tag + .tag:not(.example) { margin-left: 2px; }
.tag.good { color: var(--gold); }
.tag.example { color: var(--muted); background: transparent; border: 1px dashed var(--line); font-weight: 500; padding: 0 6px; }

.seg { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); background: #E7EBF3; border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 7px 4px; font-size: 13.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: 0 1px 3px rgba(18, 25, 51, .08); }

.search { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 14px; }
.page-title { display: flex; align-items: center; gap: 9px; font-family: var(--font-display); font-size: 24px; font-weight: 700; color: var(--ink); letter-spacing: -0.03em; line-height: 1.2; padding-inline: 2px; }
.page-title::before { content: ""; flex: none; width: 5px; height: 22px; border-radius: 3px; background: linear-gradient(180deg, #E6A92E, #C98A12); }
.note { background: var(--accent-soft); color: var(--ink-2); border-radius: 12px; padding: 10px 14px; font-size: 13px; }

.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: 13px; font-weight: 500; color: var(--ink-2); }
.input, textarea.input, select.input { width: 100%; border: 1px solid var(--line); background: #F8F9FC; border-radius: 10px; padding: 10px 12px; }
textarea.input { min-height: 140px; resize: vertical; line-height: 1.7; }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; }

.progress { height: 6px; background: var(--accent-soft); border-radius: 999px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.dots { display: flex; flex-wrap: wrap; gap: 4px; }
.dots i { width: 10px; height: 10px; border-radius: 3px; background: #DCE2EE; }
.dots i.on { background: var(--gold); }
.dots i.today { outline: 2px solid var(--navy); outline-offset: 1px; }
.dots i.future { background: transparent; border: 1px solid var(--line); }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface); box-shadow: var(--shadow); border-radius: var(--r); padding: 12px; }
.stat b { display: block; font-family: var(--font-display); font-size: 19px; color: var(--navy); white-space: nowrap; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.chart { display: grid; align-items: end; gap: 4px; height: 150px; padding-top: 18px; border-bottom: 1px solid var(--line); }
.chart .bar { position: relative; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 2px; }
.chart .bar.zero { background: var(--line); }
.chart .bar b { position: absolute; top: -17px; left: 50%; transform: translateX(-50%); font-size: 10.5px; font-weight: 500; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chart-x { display: grid; gap: 4px; font-size: 10.5px; color: var(--muted); text-align: center; margin-top: 4px; font-variant-numeric: tabular-nums; }

.paper { background: var(--paper); border: 1px solid var(--paper-line); border-radius: 6px; padding: 22px 20px; font-family: var(--font-display); background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 31px, var(--paper-line) 31px, var(--paper-line) 32px); background-position: 0 14px; line-height: 32px; }
.paper .date { font-size: 13px; color: var(--muted); }
.paper .vs { color: var(--gold); font-size: 14.5px; }
.paper .body { white-space: pre-wrap; font-size: 16px; }
textarea.paper { width: 100%; min-height: 260px; resize: vertical; font-size: 16px; padding-top: 8px; }

.comment { border-top: 1px solid var(--line); padding-top: 10px; }
.comment b { font-size: 13px; }
.comment p { margin: 2px 0 0; font-size: 14px; white-space: pre-wrap; }
.body-text { white-space: pre-wrap; font-size: 15px; line-height: 1.85; margin: 0; color: var(--ink); }

.sheet-back { position: fixed; inset: 0; z-index: 20; background: rgba(12, 18, 40, 0.42); display: flex; align-items: flex-end; justify-content: center; }
.sheet { position: relative; background: var(--surface); width: 100%; max-width: 560px; max-height: 86%; overflow-y: auto; overscroll-behavior: contain; border-radius: 22px 22px 0 0; padding: 0 18px calc(24px + env(safe-area-inset-bottom, 0px)); transition: max-height .25s ease, border-radius .25s ease; }
.sheet.full { height: 100%; max-height: 100%; border-radius: 0; }
.sheet.full .sheet-head { padding-top: calc(16px + env(safe-area-inset-top, 0px)); }
.sheet.full .grab { top: calc(6px + env(safe-area-inset-top, 0px)); }
.sheet.full textarea.input, .sheet.full textarea.paper { min-height: calc(100vh - 250px); min-height: calc(100dvh - 250px); }
.grab { position: absolute; top: 6px; left: 50%; width: 40px; height: 5px; margin-left: -20px; border-radius: 99px; background: #D3D9E6; }
.sheet-tools { display: flex; align-items: center; gap: 6px; flex: none; }
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.checks { display: flex; flex-wrap: wrap; gap: 8px 18px; }
.check.urgent { color: #B42A1A; font-weight: 700; }
.pill.red { color: #B42A1A; background: #FDEBE8; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.scrap { flex: none; display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 0 14px; font-size: 13px; font-weight: 700; }
.scrap svg { width: 17px; height: 17px; }
.scrap[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.scrap[aria-pressed="true"] svg { fill: currentColor; }
.time-card { background: linear-gradient(160deg, #FFFFFF 0%, var(--accent-soft) 100%); border-radius: 20px; padding: 18px 18px 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; }
.time-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.time-top .label { font-size: 13px; color: var(--ink-2); font-weight: 700; letter-spacing: 0; }
.date-chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 10px; font-size: 12.5px; color: var(--ink-2); max-width: 150px; }
.time-big { display: flex; align-items: baseline; gap: 4px; color: var(--navy); font-family: var(--font-display); line-height: 1; }
.time-big b { font-size: 46px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.time-big span { font-size: 18px; font-weight: 700; margin-right: 6px; }
.time-big.bump { animation: bump .35s ease-out; }
@keyframes bump { 40% { transform: scale(1.06); } }
.time-sub { font-size: 13px; color: var(--ink-2); margin-top: -6px; }
.quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.quick button { border: 0; border-radius: 12px; padding: 11px 0; background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: 14.5px; box-shadow: 0 3px 10px rgba(38, 55, 119, .22); }
.quick button:active { transform: scale(.96); }
.manual { display: flex; gap: 8px; }
.manual .input { flex: 1; min-width: 0; background: var(--surface); }
.log { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.log li { display: flex; align-items: center; gap: 10px; padding: 9px 2px; border-bottom: 1px solid var(--line-2); font-size: 13.5px; }
.log li .at { color: var(--muted); font-variant-numeric: tabular-nums; width: 64px; flex: none; }
.log li b { flex: 1; color: var(--gold); }
.log li button { background: none; border: 0; color: var(--muted); font-size: 12px; padding: 4px; }
.relay-bar { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.relay-bar .progress { flex: 1; }

  function prayHead() {

  }
  function slotLabel(k) { var h = Math.floor(k / 2), m = k % 2 ? '30' : '00'; return pad(h) + ':' + m; }
  function slotRange(k) { return slotLabel(k) + '~' + (k === 47 ? '24:00' : slotLabel(k + 1)); }
  function relayEnd(r) { return addDays(r.start, r.days - 1); }
  function mySlots(r) {
    var out = [], t = today();
    Object.keys(r.slots).sort().forEach(function (d) { if (d < t) return; Object.keys(r.slots[d]).forEach(function (k) { if (r.slots[d][k].me) out.push([d, +k]); }); });

  }
  function vRelays() {
    var t = today();
    var h = '<div class="note">운영자가 올린 주제로, 하루를 30분씩 48개 시간대로 나눠 이어서 기도해요. 원하는 시간대를 예약하고 그 시간에 기도해 주세요.</div>';
    (S.relays || []).filter(function (r) { return !r.roomId; }).forEach(function (r) {
      var on = t >= r.start && t <= relayEnd(r), filled = on ? Object.keys(r.slots[t] || {}).length : 0, mine = mySlots(r).length;
      h += '<button class="post" data-relay="' + r.id + '"><div class="row" style="gap:6px"><span class="tag gold">릴레이 기도</span>' + (on ? '<span class="pill green">진행 중</span>' : '<span class="pill amber">' + (t < r.start ? '시작 전' : '마감') + '</span>') + exampleTag(r) + '</div>' +

        '<div class="meta"><span>' + esc(r.by) + '</span><span>' + md(r.start) + ' ~ ' + md(relayEnd(r)) + ' · ' + r.days + '일</span>' + (mine ? '<span class="cnt">내 예약 ' + mine + '</span>' : '') + '</div>' +
        (on ? '<div class="relay-bar"><div class="progress"><i style="width:' + Math.round(filled / 48 * 100) + '%"></i></div><span>오늘 ' + filled + '/48 시간대</span></div>' : '') + '</button>';
    });
    return h;
  }
  function openRelay(id) {
    var r = S.relays.find(function (x) { return x.id === id; }), t = today();
    var first = r.start > t ? r.start : t, last = relayEnd(r);
    if (!rDay || rDay < first || rDay > last) rDay = first;
    var days = []; for (var d = first, i = 0; d <= last && i < 14; d = addDays(d, 1), i++) days.push(d);
    var now = new Date(), nowK = now.getHours() * 2 + (now.getMinutes() >= 30 ? 1 : 0), map = r.slots[rDay] || {};
    var mine = mySlots(r);
    var groups = [['새벽', 0, 12], ['오전', 12, 24], ['오후', 24, 36], ['저녁', 36, 48]];
    var grid = groups.map(function (g) {
      var cells = '';
      for (var k = g[1]; k < g[2]; k++) {

        cells += '<button class="slot' + (s0 ? (s0.me ? ' mine' : ' taken') : '') + (past ? ' past' : '') + '" data-slot="' + k + '"' + ((past || (s0 && !s0.me)) ? ' disabled' : '') + '><b>' + slotLabel(k) + '</b><span>' + (s0 ? (s0.me ? '내 시간' : esc(s0.n)) : past ? '지남' : '비어 있음') + '</span></button>';
      }
      return cells ? '<div class="slot-group"><div class="label">' + g[0] + '</div><div class="slots">' + cells + '</div></div>' : '';
    }).join('');
    sheet('릴레이 기도',
      '<div><div class="row" style="gap:6px"><span class="tag gold">릴레이 기도</span>' + exampleTag(r) + '</div><h2 style="font-size:19px;margin-top:8px">' + esc(r.title) + '</h2><div class="meta" style="margin-top:4px"><span>' + esc(r.by) + '</span><span>' + md(r.start) + ' ~ ' + md(last) + '</span></div></div>' +

      (mine.length ? '<div class="note"><b>내 예약</b> ' + mine.slice(0, 4).map(function (m) { return md(m[0]) + ' ' + slotRange(m[1]); }).join(', ') + (mine.length > 4 ? ' 외 ' + (mine.length - 4) + '개' : '') + '</div>' : '') +
      '<div class="chips">' + days.map(function (d) { return '<button class="chip" data-rday="' + d + '" data-rid="' + r.id + '" aria-pressed="' + (d === rDay) + '">' + (d === t ? '오늘' : md(d)) + '</button>'; }).join('') + '</div>' +
      '<div class="row between small"><span class="muted">' + (rDay === t ? '오늘' : md(rDay)) + ' · ' + Object.keys(map).length + '/48 시간대 채워짐</span><span class="legend"><i class="lg mine"></i>내 시간 <i class="lg taken"></i>예약됨</span></div>' +
      (rDay === t ? '<div class="small muted">지난 시간대는 숨겼어요.</div>' : '') + '<div id="relayGrid" data-rid="' + r.id + '">' + grid + '</div>');
  }

    var t = today(), me = { n: myName(), me: true, on: prayedOn(t), w: sumRange(addDays(t, -6), t) };
    return [me].concat(r.members.map(function (m) { return { n: m.n, on: m.last === t, w: m.w, lead: m.n === r.leader }; }));

  function picsHtml(list) {

  function picPicker(note, show) {

  function picRowHtml() {
    return PICS.map(function (p, i) { return '<div class="pic-th"><img src="' + esc(p.url) + '" alt=""><button type="button" class="pic-x" data-pic-del="' + i + '" aria-label="사진 빼기">×</button></div>'; }).join('') +
      (PICS.length < PIC_MAX ? '<label class="pic-add"><input type="file" accept="image/*" multiple hidden data-act="pic-add"><span>＋</span><small>사진 추가</small></label>' : '');
  }
  function refreshPics() { var r = el('picRow'); if (r) r.innerHTML = picRowHtml(); }
  // 휴대폰 사진(3~5MB)을 긴 변 1280px, 약 200KB 로 줄여요
  function shrinkPic(file) {
    return new Promise(function (ok, no) {
      var img = new Image(), u = URL.createObjectURL(file);
      img.onload = function () {
        var w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, 1280 / Math.max(w, h)), c = document.createElement('canvas');
        c.width = Math.round(w * k); c.height = Math.round(h * k);
        var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
        c.toBlob(function (b) { if (b && b.size > 450000) c.toBlob(function (b2) { ok(b2 || b); }, 'image/jpeg', 0.6); else if (b) ok(b); else no(new Error('사진')); }, 'image/jpeg', 0.8);
      };
      img.onerror = function () { URL.revokeObjectURL(u); no(new Error('사진')); };
      img.src = u;
    });
  }
  function addPics(files) {
    var list = Array.prototype.slice.call(files || [], 0, PIC_MAX - PICS.length);
    if ((files || []).length > list.length) toast('사진은 ' + PIC_MAX + '장까지 붙일 수 있어요');
    list.reduce(function (pr, f) { return pr.then(function () { return shrinkPic(f).then(function (b) { PICS.push({ blob: b, url: URL.createObjectURL(b) }); refreshPics(); }); }); }, Promise.resolve())
      .catch(function () { toast('이 사진은 열 수 없어요. 다른 사진을 골라 주세요'); refreshPics(); });
  }
  function blobUrl(b) { return new Promise(function (ok) { var r = new FileReader(); r.onload = function () { ok(r.result); }; r.readAsDataURL(b); }); }
  // 사진을 올리고 글에 연결해요. after: 글 저장이 끝나면 풀리는 약속
  function attachPics(kind, obj, pics, after) {
    if (!SB) {
      return Promise.all(pics.map(function (p) { return p.blob ? blobUrl(p.blob) : p.url; })).then(function (urls) { obj.images = urls; save(); render(); });
    }
    obj.images = pics.map(function (p) { return p.url; }); C.pendPics = C.pendPics || {}; C.pendPics[obj.id] = obj.images;
    if (pics.some(function (p) { return p.blob; })) toast('사진을 올리고 있어요…');

    })).then(function (urls) {

    }).then(function () { delete C.pendPics[obj.id]; }, function (e) { delete C.pendPics[obj.id]; obj.images = []; render(); toast('사진을 올리지 못했어요. 글은 올라갔어요'); });
  }

    if (e.target.dataset && e.target.dataset.jf && e.target.dataset.jf.indexOf('ag_') === 0) { jSync(); render(); return; }

  el('topWrite').addEventListener('click', function () { writePost('pray', { cat: tab === 'pray' && cat !== '전체' ? cat : '' }); });
  document.addEventListener('input', function (e) {

  document.addEventListener('keydown', function (e) {

  });

  // ---------- 서버 연결 (config.js 에 주소와 키가 있을 때만 켜져요) ----------
  var SB = CLOUD_CFG ? window.supabase.createClient(CLOUD_CFG.url, CLOUD_CFG.key) : null;
  C = { user: null, checked: !SB, joined: false, ready: false, staff: '', stats: null, timer: 0, at: 0, sent: {} };
  function cloudErr(e) {
    var m = (e && (e.message || e.error_description || e.msg)) || '';
    if (/fetch|network/i.test(m) || !m) m = '서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요';
    if (/Invalid login credentials/i.test(m)) m = '이메일이나 비밀번호가 맞지 않아요';
    if (/already registered|already exists/i.test(m)) m = '이미 가입한 이메일이에요. 로그인해 주세요';
    if (/Password should be/i.test(m)) m = '비밀번호는 6자 이상으로 정해 주세요';
    toast(m);
  }
  function cloud(fn, args) {
    if (!SB || !C.user) return Promise.resolve(null);
    return SB.rpc(fn, args || {}).then(function (r) { pullSoon(); if (r.error) { cloudErr(r.error); return null; } return r.data === null ? true : r.data; }, function (e) { cloudErr(e); return null; });
  }
  function pullSoon() { clearTimeout(C.timer); C.timer = setTimeout(pull, 350); }
  function qv(view, mod) { var b = SB.from(view).select('*'); return Promise.resolve(mod ? mod(b) : b).then(function (r) { if (r.error) throw r.error; return r.data || []; }); }
  function pull() {
    if (!SB || !C.user) return Promise.resolve();
    return Promise.all([qv('v_me'), qv('v_posts', function (b) { return b.order('created_at', { ascending: false }).limit(400); }), qv('v_chats'), qv('v_rooms'), qv('v_relays'), qv('v_verses'),
      qv('v_guides', function (b) { return b.order('created_at', { ascending: false }); }), qv('v_my_state').catch(function () { return null; }), qv('v_post_pics').catch(function () { return []; })])
      .then(function (r) { applyPull(r); if (C.joined && r[7]) pApply(r[7][0] ? r[7][0].data : null); C.ready = true; return C.staff ? pullAdmin() : null; })
      .then(function () {

        var a = document.activeElement;

  }
  // ---------- 기도다이어리 서버 보관 ----------
  // 개인 기록을 조각(기도제목 하나, 하루 기도 시간 등)으로 나눠, 조각마다 마지막으로 고친 시각을 적어 둬요.
  // 휴대폰과 다른 기기의 기록을 합칠 때 더 나중에 고친 쪽을 남기고, 지운 조각은 다시 살아나지 않게 해요.
  var PK = { items: 'id', letters: 'id', scraps: 'self', times: 'obj', log: 'obj', alarm: 'one' }, pSnap = null;
  function pEntries(st) {
    var m = {};
    Object.keys(PK).forEach(function (k) {
      var v = st[k], t = PK[k];
      if (t === 'one') { if (v != null) m[k] = v; }
      else if (t === 'obj') Object.keys(v || {}).forEach(function (d) { m[k + ':' + d] = v[d]; });
      else (v || []).forEach(function (x) { m[k + ':' + (t === 'self' ? x : x.id)] = x; });
    });
    return m;
  }
  function pJson(m) { var o = {}; Object.keys(m).forEach(function (k) { o[k] = JSON.stringify(m[k]); }); return o; }
  function pStamp() {
    var m = pEntries(S), now = Date.now(); S.pAt = S.pAt || {}; S.gone = S.gone || {};
    if (!pSnap) { Object.keys(m).forEach(function (k) { if (!S.pAt[k]) S.pAt[k] = 1; }); pSnap = pJson(m); return; }
    var j = pJson(m);
    Object.keys(j).forEach(function (k) { if (pSnap[k] !== j[k]) { S.pAt[k] = now; delete S.gone[k]; } });
    Object.keys(pSnap).forEach(function (k) { if (!(k in j)) { S.gone[k] = now; delete S.pAt[k]; } });
    pSnap = j;
  }
  function pData(st) { var o = { pAt: st.pAt || {}, gone: st.gone || {} }; Object.keys(PK).forEach(function (k) { if (st[k] != null) o[k] = st[k]; }); return o; }
  function pMerge(L, R) {
    var mL = pEntries(L), mR = pEntries(R), aL = L.pAt || {}, aR = R.pAt || {}, gone = {}, pAt = {}, keep = {}, order = [];
    [L.gone || {}, R.gone || {}].forEach(function (g) { Object.keys(g).forEach(function (k) { gone[k] = Math.max(gone[k] || 0, g[k]); }); });
    Object.keys(mL).concat(Object.keys(mR)).forEach(function (k) {
      if (k in keep || order.indexOf(k) >= 0) return; order.push(k);
      var a = k in mL ? (aL[k] || 1) : -1, b = k in mR ? (aR[k] || 1) : -1, t = Math.max(a, b);
      if ((gone[k] || 0) >= t) return;
      keep[k] = a >= b ? mL[k] : mR[k]; pAt[k] = t; delete gone[k];
    });
    var o = { items: [], letters: [], scraps: [], times: {}, log: {}, alarm: L.alarm || R.alarm || null, pAt: pAt, gone: gone };
    order.forEach(function (k) {
      if (!(k in keep)) return;
      var i = k.indexOf(':'), kind = i < 0 ? k : k.slice(0, i), key = k.slice(i + 1), t = PK[kind];
      if (t === 'one') o[kind] = keep[k]; else if (t === 'obj') o[kind][key] = keep[k]; else o[kind].push(keep[k]);
    });
    return o;
  }
  function pApply(srv) {
    var merged = pMerge(pData(S), srv || {});
    Object.keys(PK).forEach(function (k) { if (merged[k] != null) S[k] = merged[k]; });
    S.pAt = merged.pAt; S.gone = merged.gone;
    S.alarm = S.alarm || defAlarm();
    pSnap = pJson(pEntries(S)); C.stateJ = JSON.stringify(srv || null); C.stateLoaded = true;
    pPushSoon();
  }
  function pPushSoon() {
    if (!SB || !C.stateLoaded) return;
    clearTimeout(C.pt);
    C.pt = setTimeout(function () {
      var d = pData(S), j = JSON.stringify(d); if (j === C.stateJ) return;
      SB.rpc('save_state', { p_data: d }).then(function (r) { if (!r.error) C.stateJ = j; });
    }, 1500);
  }

  function applyPull(r) {
    var me = r[0][0];
    C.joined = !!me;
    if (me) {
      var info = me.info || {};
      S.me.name = me.nick; S.me.real = info.real || ''; S.me.show = info.show === '실명' ? 'real' : 'nick'; S.me.role = me.role; S.me.profile = info; C.verified = !!me.verified;
      C.staff = me.staff_role || ''; C.suspended = !!(me.suspended_until && Date.parse(me.suspended_until) > Date.now());
    } else { S.me.profile = null; C.staff = ''; }
    var chats = {};
    r[2].forEach(function (c) {
      var o = chats[c.post_id] = chats[c.post_id] || { chats: {}, roles: {} };
      (o.chats[c.with_name] = o.chats[c.with_name] || []).push({ from: c.from_author ? 'a' : 'r', text: c.text, at: Date.parse(c.created_at) });
      if (c.with_role) o.roles[c.with_name] = c.with_role;
    });
    var pics = {}; (r[8] || []).forEach(function (x) { pics[x.id] = x.images || []; });
    S.posts = r[1].map(function (p) {
      var ch = chats[p.id] || { chats: {}, roles: {} };
      return { id: p.id, board: p.board, cat: p.cat, roomId: p.room_id || undefined, title: p.title, body: p.body, urgent: p.urgent, scope: p.scope || [], hideAfter: p.hide_after || undefined,
        answered: p.answered, author: p.author_name, created: Date.parse(p.created_at), mine: p.mine, prayers: p.prayers, prayed: p.prayed, reported: p.reported, reports: p.reports,
        reviewed: p.reviewed, crisisSeen: p.crisis_seen, chats: ch.chats, chatRoles: ch.roles, images: pics[p.id] || (C.pendPics && C.pendPics[p.id]) || [],
        comments: (p.comments || []).map(function (c) { return { author: c.author, role: c.role, text: c.text, created: Date.parse(c.created) }; }) };
    });
    S.rooms = r[3].map(function (x) { return { id: x.id, name: x.name, intro: x.intro, code: x.code, notice: x.notice, leader: x.leader, mine: x.mine, members: x.members || [] }; });
    S.relays = r[4].map(function (x) { return { id: x.id, roomId: x.room_id || undefined, by: x.by_name, title: x.title, desc: x.descr, start: x.start_day, days: x.days, slots: x.slots || {} }; });
    S.cloudVerses = {}; r[5].forEach(function (v) { S.cloudVerses[v.day] = { t: v.text, ref: v.ref }; });
    S.guides = r[6].map(function (g) { return { id: g.id, kind: g.kind, title: g.title, body: g.body, images: (g.images && g.images.length ? g.images : C.pendPics && C.pendPics[g.id]) || [], mine: true, at: Date.parse(g.created_at) }; });
  }
  function staffCan(area) { return !SB || (ADM_ROLES[C.staff] || []).indexOf(area) >= 0; }
  function pullAdmin() {
    return Promise.all([staffCan('회원') ? qv('v_adm_members') : [], qv('v_adm_staff'), staffCan('안전') ? qv('v_adm_blocked') : [], qv('v_adm_stats'), qv('v_adm_feedback').catch(function () { return []; })]).then(function (r) {
      var A = S.admin = S.admin || {};
      A.members = r[0].map(function (m) {
        var org = m.org; org = Array.isArray(org) ? org[0] : org && typeof org === 'object' ? org.name : org;
        return { id: m.id, nick: m.nick, real: m.real_name || '', role: m.role, org: org || '', proof: m.proof || '', verify: m.verify || '', warns: m.warns || 0,
          until: m.suspended_until ? Date.parse(m.suspended_until) : 0, joined: Date.parse(m.created_at) };
      });
      A.staff = r[1].map(function (s) { return { id: s.user_id === C.user.id ? 'me' : s.user_id, role: s.role, name: s.name }; });
      A.blocked = r[2].map(function (b) { return { at: Date.parse(b.at), who: b.alias || b.who, text: b.text }; }).reverse();
      A.verses = S.cloudVerses;
      C.stats = r[3][0] || null;
      A.feedback = r[4].map(fbMap);
    });
  }
  // 기도 시간과 출석은 모임방 얼굴과 주간 기도 시간에 쓰여요
  function actSoon() {
    clearTimeout(C.at);
    C.at = setTimeout(function () {
      for (var i = 0; i < 8; i++) {
        var d = addDays(today(), -i), m = +S.times[d] || 0, pr = prayedOn(d), k = m + '|' + pr;
        if (C.sent[d] !== k && (m || pr || C.sent[d] !== undefined || i === 0)) { C.sent[d] = k; SB.rpc('log_activity', { p_day: d, p_minutes: m, p_prayed: pr }).then(function () {}, function () {}); }
      }
    }, 800);
  }
  function afterAuth(user) {
    C.user = user; C.checked = true;
    if (user) { try { localStorage.setItem('pt-was', '1'); } catch (e) {} }
    if (!user) { tab = 'join'; render(); return Promise.resolve(); }
    return pull().then(function () {
      if (!C.joined) { J = { step: 1, provider: 'email', name: '' }; tab = 'join'; }
      else if (tab === 'join') { J = null; tab = 'home'; }
      render();
    });
  }
  function cloudAuth(kind) {
    var em = val('cEmail'), pw = el('cPw') ? el('cPw').value : '';
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) return toast('이메일 주소를 확인해 주세요');
    if (pw.length < 6) return toast('비밀번호는 6자 이상으로 정해 주세요');
    var p = kind === 'signup' ? SB.auth.signUp({ email: em, password: pw }) : SB.auth.signInWithPassword({ email: em, password: pw });
    p.then(function (r) {
      if (r.error) return cloudErr(r.error);
      if (!r.data.session) return toast('가입 확인 메일을 보냈어요. 메일의 링크를 누른 뒤 로그인해 주세요');
      afterAuth(r.data.session.user);
    }, cloudErr);
  }
  // 처음 온 분이 한눈에 알 수 있게: 무슨 앱인지, 무엇을 할 수 있는지
  function introHtml() {
    var sv = function (d) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + d + '</svg>'; };
    var F = [
      [sv('<path d="M4 5h16v11H8l-4 4z"/><path d="M8 9h8M8 12h5"/>'), '기도 제목 나누기', '내 기도 제목을 올리면 성도들이 함께 기도해요'],
      [sv('<path d="M12 21s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.6-7 10-7 10z"/>'), '서로를 위해 중보기도', '다른 분의 기도 제목에 "기도했어요"로 마음을 전해요'],
      [sv('<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/>'), '나의 기도 다이어리', '기도 시간과 응답을 기록하고 매일 출석해요'],
      [sv('<path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9.5 12l2 2 3.5-4"/>'), '말 못할 사연', '이름을 숨기고 목회자·상담사와 고민을 나눠요']
    ];
    return '<div class="card intro"><p class="lead"><b>기도 제목을 나누고, 서로를 위해 대신 기도해 주는</b><br>중보기도 공동체 앱이에요.</p>' +
      F.map(function (f) { return '<div class="f"><i>' + f[0] + '</i><div><b>' + f[1] + '</b><span>' + f[2] + '</span></div></div>'; }).join('') + '</div>';
  }
  function cSignup() { if (J && J.cMode) return J.cMode === 'signup'; try { return !localStorage.getItem('pt-was'); } catch (e) { return true; } }
  function cloudLogin() {
    if (!C.checked) return '<div class="empty">불러오는 중이에요…</div>';
    var signup = cSignup();
    return '<div class="join-hero"><span class="mark">' + document.querySelector('.brand .mark').innerHTML + '</span><h1>합력하여 선을 이루는 기도</h1><p>얼굴을 몰라도, 서로를 위해 기도하는 곳</p></div>' + introHtml() +
      '<div class="note">지금은 시험 운영 중이에요. 이메일과 비밀번호로 ' + (signup ? '가입해' : '로그인해') + ' 주세요.</div>' +
      '<div class="card stack"><label class="field"><span>이메일</span><input class="input" id="cEmail" type="email" autocomplete="email" placeholder="you@example.com"></label>' +
      '<label class="field"><span>비밀번호</span><input class="input" id="cPw" type="password" autocomplete="' + (signup ? 'new-password' : 'current-password') + '" placeholder="6자 이상"></label>' +
      '<button class="btn block" data-act="' + (signup ? 'c-signup' : 'c-login') + '">' + (signup ? '가입하기' : '로그인') + '</button>' +
      '<button class="linkbtn blue" data-act="c-mode">' + (signup ? '이미 가입했어요. 로그인할게요' : '처음이에요. 가입할게요') + '</button></div>' +
      (isInstalled() ? '' : '<button class="linkbtn" data-act="install" style="align-self:center">휴대폰 홈 화면에 앱으로 설치하는 방법</button>');
  }
  if (SB) {
    SB.auth.getSession().then(function (r) { afterAuth(r.data && r.data.session ? r.data.session.user : null); }, function () { afterAuth(null); });
    setInterval(function () { if (document.visibilityState === 'visible' && C.user) pull(); }, 30000);
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && C.user) pull(); });
  }

  render();
  // 홈 화면 아이콘 바로가기 (안드로이드에서 아이콘을 꾹 누르면 나와요)
  (function () {
    var m = /[?&]do=([a-z0-9]+)/.exec(location.search); if (!m) return;
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
    var run = function () {
      if (tab === 'join') return;
      if (m[1] === 'time10') { tab = 'home'; render(); addTime(today(), 10); }
      else if (m[1] === 'attend') { tab = 'home'; render(); attendSheet(); }
      else if (m[1] === 'write') { tab = 'pray'; render(); writePost('pray', {}); }
    };
    if (SB) { var tries = 0, w = setInterval(function () { if (C.ready || ++tries > 40) { clearInterval(w); if (C.ready) run(); } }, 250); } else run();
  })();
  setInterval(alarmTick, 15000); alarmTick();
  if ('serviceWorker' in navigator && location.protocol === 'https:' && document.querySelector('link[rel=manifest]')) {
    try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {}
  }
})();
